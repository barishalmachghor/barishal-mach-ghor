<!DOCTYPE html>
<html lang="bn">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>অর্ডার - বরিশাল মাছ ঘর</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<h1>🐟 বরিশাল মাছ ঘর</h1>

<h2>📝 অর্ডার করুন</h2>

<form action="/place_order" method="POST">

<input type="text" name="name" placeholder="আপনার নাম" required>

<br><br>

<input type="text" name="phone" placeholder="মোবাইল নম্বর" required>

<br><br>

<textarea name="address" placeholder="আপনার ঠিকানা" required></textarea>

<br><br>

<select name="fish_id" required>

{% for fish in fishes %}

<option value="{{ fish.id }}"
{% if selected_fish_id == fish.id %}selected{% endif %}>
{{ fish.name }} - ৳{{ fish.price }}/কেজি
</option>

{% endfor %}

</select>

<br><br>

<input type="number" name="quantity" placeholder="কত কেজি" required>

<br><br>

<button type="submit">
অর্ডার করুন
</button>

</form>

</body>

</html>
