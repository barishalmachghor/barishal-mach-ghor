<!DOCTYPE html>
<html lang="bn">

<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forgot Password</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<h1>🔑 Reset Password</h1>

<form method="POST">

<input type="text"
name="phone"
placeholder="Admin Mobile Number"
required>

<br><br>

<input type="password"
name="new_password"
placeholder="New Password (যেমন: 1234abcd)"
required>

<br><br>

<input type="password"
name="confirm_password"
placeholder="Confirm Password"
required>

<br><br>

<button type="submit">
Update Password
</button>

</form>

<br>

<a href="/admin">
⬅️ Back to Login
</a>

</body>

</html>
