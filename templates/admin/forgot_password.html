<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <h1>🔑 Forgot Password</h1>

    <form method="POST">

        <input
            type="email"
            name="email"
            placeholder="আপনার Gmail লিখুন"
            required>

        <br><br>

        <button type="submit">
            Reset Link পাঠান
        </button>

    </form>

    <br>

    <a href="/admin">
        ⬅️ Back to Login
    </a>

</body>

</html>
